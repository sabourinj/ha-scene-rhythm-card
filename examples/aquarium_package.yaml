# Example package for ONE tank. Copy to /config/packages/reef_lights.yaml
# and repeat (renaming "reef") for each tank.
#
# Idea: the input_select is the single source of truth for "current scene".
#   - The schedule automation only SETS the helper.
#   - The apply automation turns on the matching scene whenever the helper changes.
#   - The card's arrows also just set the helper, so manual and scheduled changes
#     go through the same path and the card always shows what's really applied.

input_select:
  reef_light_scene:
    name: Reef light scene
    icon: mdi:fishbowl-outline
    options:
      - Night
      - Dawn
      - Morning
      - Midday
      - Sunset
      - Moonlight

automation:
  # 1) Schedule: your existing automation, but set the helper instead of
  #    calling scene.turn_on. Trigger ids must match the helper options.
  - id: reef_light_schedule
    alias: Reef lights - schedule
    mode: queued
    triggers:
      - { trigger: time, at: "07:00:00", id: Dawn }
      - { trigger: time, at: "09:00:00", id: Morning }
      - { trigger: time, at: "12:00:00", id: Midday }
      - { trigger: time, at: "18:00:00", id: Sunset }
      - { trigger: time, at: "20:30:00", id: Moonlight }
      - { trigger: time, at: "23:00:00", id: Night }
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.reef_light_scene
        data:
          option: "{{ trigger.id }}"

  # 2) Apply: helper changed (by schedule, card, or anything else) -> scene.
  - id: reef_light_apply
    alias: Reef lights - apply scene
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.reef_light_scene
        not_to: [unknown, unavailable]
      - trigger: homeassistant
        event: start
    variables:
      scenes:
        Night: scene.reef_night
        Dawn: scene.reef_dawn
        Morning: scene.reef_morning
        Midday: scene.reef_midday
        Sunset: scene.reef_sunset
        Moonlight: scene.reef_moonlight
      scene: "{{ scenes.get(states('input_select.reef_light_scene'), '') }}"
    conditions:
      - "{{ scene != '' }}"
    actions:
      - action: scene.turn_on
        target:
          entity_id: "{{ scene }}"
        # data:
        #   transition: 60   # optional fade, if your lights support it
